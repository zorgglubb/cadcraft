[package]
name = "cadcraft-engine"
description = "CADCraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-constraints = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-topo-calc = { workspace = true }
cadcraft-topo-io = { workspace = true }
cadcraft-terrain = { workspace = true }
cadcraft-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[dev-dependencies]

# Cadastre DXF download (PLAN.IMPORT_CADASTRE_DXF): native builds only - wasm32 has no socket
# access, so the command reports "not available" there instead of pulling these in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Sync HTTP client, no async runtime (MIT OR Apache-2.0).
ureq = { version = "2", default-features = false, features = ["tls"] }
# Tar archive reader (MIT OR Apache-2.0).
tar = "0.4"
# Pure-Rust bzip2 decoder - no C toolchain/libbz2 build dependency (MIT).
bzip2-rs = "0.1"
