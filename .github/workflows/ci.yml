# Runs the quality gate every PR and push to main must pass: the same `cargo xtask ci` a
# contributor runs locally before committing (fmt, clippy -D warnings, the full test suite,
# the asset-attribution check, the dependency-layering rules and a wasm32 build check), so a
# regression is caught before it lands instead of only being noticed on `main` afterwards.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debug info is what blew through this workspace's disk locally (each of the ~70
  # integration-test binaries links its own copy of egui/wgpu/wgpu-hal with it); line tables
  # alone are enough to point at a failing assertion, well short of a real debugger session.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runner images carry toolchains this workspace never touches (a full .NET SDK, the
      # Android SDK, GHC, Boost); clearing them back ~25-40GB of disk before a Rust build this
      # size needs it, the same crunch hit while developing this workflow.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config

      # @stable (not SHA-pinned): the whole point of this action is that it always resolves to
      # whatever's currently the latest stable Rust release, same as a contributor's `rustup`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: cargo xtask ci
        run: cargo xtask ci
